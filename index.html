<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualisation pedagogique de la blockchain - Convoi Ferroviaire</title>
  <link rel="stylesheet" href="./src/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="webgl"></canvas>

    <!-- Superposition HUD 2D -->
    <div id="hud">
      <!-- En-tete superieur (Compteur FPS uniquement) -->
      <header class="hud-top">
        <div class="hud-fps-pill">
          <span class="stat-dot fps-dot"></span>
          <span id="fps-counter">60 FPS</span>
        </div>
      </header>

      <!-- Volet pedagogique gauche pour les etapes avec marque-pages sur le bord droit -->
      <aside id="step-panel-left" class="hud-step-panel" aria-label="Volet pedagogique de l'etape">
        <!-- Marque-pages des etapes sur le bord droit (uniquement les numeros 0 a 7) -->
        <nav id="step-bookmark-tabs" class="step-bookmark-tabs" aria-label="Marque-pages des etapes">
          <button class="step-tab-btn active" data-step="0" title="Notion 0 : Introduction">0</button>
          <button class="step-tab-btn" data-step="1" title="Notion 1 : Structure du bloc">1</button>
          <button class="step-tab-btn" data-step="2" title="Notion 2 : Chainage cryptographique">2</button>
          <button class="step-tab-btn" data-step="3" title="Notion 3 : Immutabilite">3</button>
          <button class="step-tab-btn" data-step="4" title="Notion 4 : Reseau distribue">4</button>
          <button class="step-tab-btn" data-step="5" title="Notion 5 : Minage">5</button>
          <button class="step-tab-btn" data-step="6" title="Notion 6 : Consensus">6</button>
          <button class="step-tab-btn" data-step="7" title="Notion 7 : Attaque des 51%">7</button>
        </nav>
      </aside>

      <!-- Panneau lateral droit d'inspection du wagon -->
      <aside id="inspection-sidebar" class="hud-sidebar" aria-hidden="true">
        <div class="sidebar-header">
          <div class="sidebar-title-group">
            <span class="sidebar-badge">Inspection 3D</span>
            <h2 id="sidebar-wagon-title">Wagon #0 (Bloc Genesis)</h2>
          </div>
          <div class="sidebar-header-actions">
            <button id="btn-wagon-prev" class="btn-nav-wagon" title="Wagon précédent">&larr;</button>
            <button id="btn-wagon-next" class="btn-nav-wagon" title="Wagon suivant">&rarr;</button>
            <button id="btn-close-sidebar" class="btn-close" aria-label="Fermer le panneau">&times;</button>
          </div>
        </div>

        <div class="sidebar-body">
          <div class="field-group">
            <label for="field-index">Index du bloc</label>
            <input type="text" id="field-index" readonly value="0">
          </div>

          <div class="field-group">
            <label for="field-data">Marchandises transportees (Transactions)</label>
            <textarea id="field-data" rows="3" readonly></textarea>
          </div>

          <div class="field-group">
            <label for="field-prev-hash">Attelage precedent (previousHash)</label>
            <input type="text" id="field-prev-hash" class="code-font" readonly value="0000000000000000">
          </div>

          <div class="field-group">
            <label for="field-hash">Plaque d'empreinte gravee (hash)</label>
            <input type="text" id="field-hash" class="code-font" readonly value="0000a89f41b2c3d4">
          </div>

          <div class="field-group">
            <label for="field-nonce">Molette de verrouillage (Nonce)</label>
            <input type="text" id="field-nonce" class="code-font" readonly value="2084">
          </div>

          <div class="field-group">
            <label>Etat de l'attelage magnetique</label>
            <div id="field-status" class="status-indicator valid">
              <span class="status-bulb"></span>
              <span id="field-status-text">Attelage magnetique actif</span>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
